<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Любимые матчи Криштиану Роналду: счёт, голы и заметки"
    />
    <title>Матчи Роналду</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <header class="page-header">
      <div class="page-header__content">
        <p class="page-header__eyebrow">ДЗ 6 · HTTP и API</p>
        <h1 class="page-header__title">Матчи Роналду</h1>
        <p class="page-header__lead">
          Хет-трики, решающие голы и тот самый удар через себя.
          Коллекция любимых матчей с заметками и ссылками на отчёты.
        </p>
      </div>
    </header>

    <main class="workspace">
      <section class="panel panel--collection" aria-labelledby="collection-title">
        <div class="panel__header">
          <div>
            <p class="panel__eyebrow">Коллекция</p>
            <h2 class="panel__title" id="collection-title">Сохранённые матчи</h2>
          </div>

          <button class="button button--secondary" type="button" data-action="reload">
            Обновить
          </button>
        </div>

        <div class="status" data-ui="status" role="status" aria-live="polite">
          <strong class="status__title">Загрузка матчей</strong>
          <span class="status__text">Получаем коллекцию. Подождите немного.</span>
        </div>

        <div class="collection" data-ui="collection" hidden></div>
      </section>
    </main>

    <footer class="page-footer">
      <p class="page-footer__text">
        Любимые матчи Криштиану Роналду
      </p>
    </footer>
  </body>
</html>
